name: Build & Publish Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile Dependencies
        run: npm ci

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Generate Release Signing Keystore
        working-directory: mobile/android/app
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias ahtri-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ahtri123 \
            -keypass ahtri123 \
            -dname "CN=AHTRI, OU=Mobile, O=AHTRI Pharma, L=Delhi, S=Delhi, C=IN"

      - name: Configure Gradle Signing
        working-directory: mobile/android
        run: |
          # Configure release signing config in app/build.gradle
          sed -i '/signingConfigs {/a \        release {\n            storeFile file("release.keystore")\n            storePassword "ahtri123"\n            keyAlias "ahtri-key"\n            keyPassword "ahtri123"\n        }' app/build.gradle
          sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' app/build.gradle || true

      - name: Build Standalone APK with Gradle
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/ahtri-ffa-mobile-v${{ steps.get_version.outputs.VERSION }}.apk
          cp "$APK_PATH" build-output/ahtri-ffa-mobile.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahtri-ffa-mobile-apk
          path: mobile/build-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: AHTRI FFA Mobile v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🚀 AHTRI Field Force Automation Mobile v${{ steps.get_version.outputs.VERSION }}
            
            ### ✨ What's new in this build:
            - **Free Touch Map Gestures**: 360° fluid touch panning, tap-to-pinpoint, and 5x5 tile buffer without parent scroll conflict.
            - **Automatic In-App Updates**: Persistent version tracking suppressing redundant update dialogs after upgrading.
            - **Resilient Server Connectivity**: Automatic backend warm-up, extended cold-start tolerance, and live latency diagnostics.
            
            ### 📲 Direct Download:
            Download and install the APK directly on any Android phone:
            - **[ahtri-ffa-mobile.apk](https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION }}/ahtri-ffa-mobile.apk)**
          files: |
            mobile/build-output/ahtri-ffa-mobile-v${{ steps.get_version.outputs.VERSION }}.apk
            mobile/build-output/ahtri-ffa-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
