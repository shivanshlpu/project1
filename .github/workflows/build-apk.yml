name: Build & Publish Android APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag (e.g. v1.0.1)'
        required: false
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Mobile Dependencies
        run: npm ci || npm install

      - name: Extract App Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG_NAME=v$VERSION" >> $GITHUB_OUTPUT

      - name: Prebuild Native Android Project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ahtri123' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ahtri123' }}

      - name: Verify Permanent Release Keystore & Gradle Signing
        working-directory: mobile
        run: |
          if [ -n "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" ]; then
            mkdir -p android/app
            echo "${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          elif [ ! -f "android/app/release.keystore" ] && [ -f "credentials/ahtri-release.keystore" ]; then
            cp credentials/ahtri-release.keystore android/app/release.keystore
          fi
          echo "Release keystore verified for automated build."

      - name: Build Standalone APK with Gradle
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'ahtri123' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'ahtri123' }}

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/ahtri-ffa-mobile-v${{ steps.get_version.outputs.VERSION }}.apk
          cp "$APK_PATH" build-output/ahtri-ffa-mobile.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahtri-ffa-mobile-apk
          path: mobile/build-output/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: AHTRI FFA Mobile v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🚀 AHTRI Field Force Automation Mobile v${{ steps.get_version.outputs.VERSION }}
            
            ### ✨ What's new in this build:
            - **Authoritative Admin Sync**: Real-time synchronization ensuring that deletions from the Admin Panel immediately reflect in the mobile app without ghost tasks, orders, or tour plans.
            - **Automatic Cache Purge**: Stale tasks, order deliveries, and tour plan cache are automatically cleared on startup while strictly preserving user login and device authentication.
            - **On-Demand Re-Sync**: Dedicated 'Reset Local Cache & Re-sync from Admin' in Profile menu to refresh data directly from the server at any time.
            
            ### 📲 Direct Download:
            Download and install the APK directly on any Android phone:
            - **[ahtri-ffa-mobile.apk](https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.VERSION }}/ahtri-ffa-mobile.apk)**
          files: |
            mobile/build-output/ahtri-ffa-mobile-v${{ steps.get_version.outputs.VERSION }}.apk
            mobile/build-output/ahtri-ffa-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
